[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "setup-vps"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
setup-vps = "setup_vps.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["setup_vps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
